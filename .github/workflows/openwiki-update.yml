# The refresh workflow — phase 04 of the poc specs, contracts C4, C5, C6, C9, C11.
#
# A source document changed; recompile the wiki. No agent anywhere in here:
# compiling is procedural, and routing it through a model would add
# nondeterminism, latency, and a failure mode where the compile silently does
# not happen.
name: OpenWiki Refresh

on:
  push:
    branches: [main]
    # ONLY the source directories. This is the loop-breaker, and it is
    # structural rather than a guard inside the job: this workflow commits to
    # openwiki/**, so a trigger firing on any push would re-trigger itself on
    # its own output, forever. A paths filter makes that unrepresentable.
    paths:
      - 'forms/**'
      - 'bulletins/**'
      - 'guidelines/**'
  workflow_dispatch:        # manual, and the ingest API's explicit dispatch (C6)
  schedule:
    - cron: '17 7 * * *'    # the reconciler — see the job comment

# C6 layer 1. GitHub holds one pending run per group and a third dispatch
# replaces the pending one; that is correct, not lossy, because `openwiki
# --update` compiles whatever is at HEAD. Cancelling the IN-PROGRESS run would
# be lossy (OpenWiki merges pages as it finishes them), hence false.
concurrency:
  group: openwiki-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The BRANCH, not github.sha. A run that waited in the concurrency
          # queue would otherwise check out the commit frozen at event time and
          # recompile a tree that is already compiled: observed live — the
          # dispatch queued behind the push run compiled 2736ad8 a second time
          # (107 model calls), then its push was rejected because main had
          # moved. Checking out the branch resolves at job start, so the queued
          # run sees the new head, OpenWiki's no-op check skips, and C6's
          # "the run that lands sees every document" becomes true.
          ref: main
          # Full history. A shallow clone hides the commit OpenWiki last
          # documented, and the update then runs against an empty change
          # summary — it recompiles nothing and reports success.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install OpenWiki
        run: npm install --global openwiki@0.5.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Record the previous compile
        id: prev
        run: |
          prev=$(jq -r '.compiled_from // empty' .compile-state.json 2>/dev/null || true)
          echo "compiled_from=$prev" >> "$GITHUB_OUTPUT"

      # C4: the delta is set arithmetic over sidecar claim ids captured BEFORE
      # the run. Nothing in this workflow parses OpenWiki's stdout.
      - name: Record claim ids before
        run: ./scripts/claim-diff.sh snapshot /tmp/claims-before.txt

      - name: Run OpenWiki
        id: openwiki
        # An interrupted run has merged some pages and skipped others. That
        # output is progress and is committed; the next run treats it as the
        # baseline. Only this step tolerates failure — a state file that
        # disagrees with the tree must never be.
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The model key is routed through the LangSmith gateway, exactly as
          # the local runs that compiled this wiki were. Without the base URL a
          # gateway key hits api.openai.com and fails.
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID || 'gpt-5.6-terra' }}
          # Matches the local runs that compiled this wiki (~/.openwiki/.env).
          OPENWIKI_REASONING_EFFORT: ${{ vars.OPENWIKI_REASONING_EFFORT || 'high' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: 'true'

      - name: Remove transient run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Record claim ids after
        if: ${{ !cancelled() }}
        run: ./scripts/claim-diff.sh snapshot /tmp/claims-after.txt

      # C11. Imports the vendored phase 02 index code; never a reimplementation.
      - name: Build the claims index
        if: ${{ !cancelled() }}
        run: python3 scripts/build-claims-index.py

      # C4. Asserts compiled_from == .last-update.json gitHead, validates the
      # schema, and exits non-zero on either — so an invalid file is never pushed.
      - name: Write and validate the compile state
        if: ${{ !cancelled() }}
        run: >
          ./scripts/claim-diff.sh write-state /tmp/claims-before.txt /tmp/claims-after.txt
          "${{ steps.openwiki.outcome }}"
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "${{ github.run_attempt }}"
          "${{ steps.prev.outputs.compiled_from }}"

      - name: Commit the compiled output
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name  'openwiki-refresh[bot]'
          git config user.email 'openwiki-refresh@users.noreply.github.com'
          git add openwiki .compile-state.json .claims-index.json
          ./scripts/assert-write-domain.sh
          if git diff --cached --quiet; then
            echo "nothing to commit: the wiki is already current"
          else
            git commit -m "docs: refresh OpenWiki (${{ steps.openwiki.outcome }})" \
                       -m "compiled_from $(jq -r .compiled_from .compile-state.json)" \
                       -m "$(jq -c .claims .compile-state.json 2>/dev/null || echo 'claims: n/a')"
            git push
          fi

      # C9. Fires on every terminal status. `|| true` because the callback is an
      # optimization — .compile-state.json in git is the mechanism.
      - name: Callback
        if: ${{ always() && !cancelled() }}
        run: ./scripts/callback.sh || true
        env:
          REFRESH_CALLBACK_URL: ${{ secrets.REFRESH_CALLBACK_URL }}
          REFRESH_CALLBACK_SECRET: ${{ secrets.REFRESH_CALLBACK_SECRET }}
          # A compile whose commit did not land is a FAILED refresh, whatever
          # OpenWiki's own status says. Observed: a rejected push followed by a
          # callback reporting "complete" for output nobody can read.
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
