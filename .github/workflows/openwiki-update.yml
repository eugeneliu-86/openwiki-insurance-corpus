# The refresh workflow (contracts C4, C5, C6, C9, C11): a source document changed,
# so recompile the wiki. Procedural throughout; no agent.
name: OpenWiki Refresh

on:
  push:
    branches: [main]
    # Source directories only: this workflow commits to openwiki/**, so any wider
    # trigger would re-trigger itself on its own output.
    paths:
      - 'forms/**'
      - 'bulletins/**'
      - 'guidelines/**'
      - 'manuals/**'
      - 'memoranda/**'
      - 'training/**'
  workflow_dispatch:        # manual, and this workflow's own resume after an interrupted run
  schedule:
    - cron: '17 7 * * *'    # the reconciler — see the job comment

# C6: one pending run per group is enough, since `openwiki --update` compiles
# whatever is at HEAD. Never cancel the in-progress run: pages merge as they finish.
concurrency:
  group: openwiki-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: write     # an interrupted compile re-dispatches itself to resume

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The branch, not github.sha: a run that waited in the queue must compile the
          # current head, not the commit frozen at event time.
          ref: main
          # Full history: a shallow clone hides the commit OpenWiki last documented, and
          # the update then compiles nothing and reports success.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install OpenWiki
        # Pinned to a commit of the unreleased trace-thread branch (langchain-ai/openwiki
        # eugeneliu/trace-thread-per-update): a run's planner and page workers share one
        # LangSmith thread. Built here, since the package has no `prepare` script; mermaid
        # and jsdom are its peer dependencies. Back to `openwiki@<version>` once released.
        run: |
          git clone --quiet --no-checkout https://github.com/langchain-ai/openwiki.git /tmp/openwiki
          git -C /tmp/openwiki checkout --quiet 1d09d9526254dea6be83cbae090dc8db9f70ea30
          corepack enable
          (cd /tmp/openwiki && pnpm install --frozen-lockfile && pnpm run build)
          npm install --global /tmp/openwiki mermaid@11.16.0 jsdom@29.1.1
          command -v openwiki

      - name: Record the previous compile
        id: prev
        run: |
          prev=$(jq -r '.compiled_from // empty' .compile-state.json 2>/dev/null || true)
          echo "compiled_from=$prev" >> "$GITHUB_OUTPUT"

      # C4: the delta is set arithmetic over claim ids captured before the run; nothing parses stdout.
      - name: Record claim ids before
        run: ./scripts/claim-diff.sh snapshot /tmp/claims-before.txt

      - name: Run OpenWiki
        id: openwiki
        # An interrupted run's merged pages are progress and are committed. Only this step
        # may fail; a state file that disagrees with the tree never may.
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The model key goes through the LangSmith gateway; without the base URL it hits api.openai.com.
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENWIKI_MODEL_ID: gpt-5.6-luna
          OPENWIKI_REASONING_EFFORT: low
          OPENWIKI_PAGE_CONCURRENCY: 6   # 1-8; OpenWiki backs off on 429s
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          # The workspace the traces land in (the poc's deployment workspace); unset, the key's default.
          LANGSMITH_WORKSPACE_ID: ${{ vars.LANGSMITH_WORKSPACE_ID }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: 'true'

      - name: Remove transient run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Record claim ids after
        if: ${{ !cancelled() }}
        run: ./scripts/claim-diff.sh snapshot /tmp/claims-after.txt

      # C11. Built with the agent's vendored modules, never a reimplementation.
      - name: Build the claims index
        if: ${{ !cancelled() }}
        run: python3 scripts/build-claims-index.py

      # Every numbered paragraph with its section, line range and text hash. No model.
      - name: Build the provisions index
        if: ${{ !cancelled() }}
        run: python3 scripts/build-provisions-index.py

      # The edges the corpus states, from the tree and the two indexes above. No model.
      - name: Build the edge artifact
        if: ${{ !cancelled() }}
        run: python3 scripts/build-graph-edges.py

      # C4: compiled_from must equal .last-update.json's gitHead and the schema must
      # validate, or nothing is pushed.
      - name: Write and validate the compile state
        id: state
        if: ${{ !cancelled() }}
        run: >
          ./scripts/claim-diff.sh write-state /tmp/claims-before.txt /tmp/claims-after.txt
          "${{ steps.openwiki.outcome }}"
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "${{ github.run_attempt }}"
          "${{ steps.prev.outputs.compiled_from }}"

      # Only with a validated state file: a tree pushed under one that disagrees is what C4 forbids.
      - name: Commit the compiled output
        id: commit
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        run: |
          git config user.name  'openwiki-refresh[bot]'
          git config user.email 'openwiki-refresh@users.noreply.github.com'
          git add openwiki .compile-state.json .claims-index.json .provisions-index.json .graph-edges.json
          ./scripts/assert-write-domain.sh
          if git diff --cached --quiet; then
            echo "nothing to commit: the wiki is already current"
            echo "landed=unchanged" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "docs: refresh OpenWiki ($(jq -r .status .compile-state.json))" \
                     -m "compiled_from $(jq -r .compiled_from .compile-state.json)" \
                     -m "$(jq -c .claims .compile-state.json 2>/dev/null || echo 'claims: n/a')"
          # If a commit landed while OpenWiki ran:
          #   a source change: this compile is stale; stop, and let that push's run recompile.
          #   anything else: the compile still holds; replay our commit on top and push.
          for attempt in 1 2 3; do
            if git push; then echo "landed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git fetch --quiet origin main
            if [ -n "$(git diff --name-only HEAD origin/main -- forms bulletins guidelines manuals memoranda training)" ]; then
              echo "superseded: a newer push changed source documents; the run it triggered recompiles. Not pushing a stale compile."
              echo "landed=superseded" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "push rejected by a non-source commit; replaying on top (attempt $attempt)"
            git rebase --quiet origin/main || { git rebase --abort; break; }
          done
          echo "landed=false" >> "$GITHUB_OUTPUT"
          echo "could not land the compiled output after 3 attempts" >&2
          exit 1

      # The demo loop: right after a complete compile lands, revert it and the ingests it
      # covered, so the corpus is back where it was. [skip ci]: nothing to recompile.
      # On only when vars.AUTO_RESET is 'true'; a conflict skips (reset from the UI instead).
      - name: Reset the ingests
        if: ${{ !cancelled() && vars.AUTO_RESET == 'true' && steps.commit.outputs.landed == 'true' }}
        run: |
          [ "$(jq -r .status .compile-state.json)" = "complete" ] || { echo "compile not complete; not resetting"; exit 0; }
          # Only ingests after the latest reset: a reset restores the old compile state, so the
          # range from the previous compile still holds ingests an earlier reset already undid.
          prev='${{ steps.prev.outputs.compiled_from }}'
          base=$(git log -1 --format=%H --grep='^reset: ' "$prev..HEAD"); base=${base:-$prev}
          ingests=$(git log --format=%H --grep='^ingest: ' "$base..HEAD")
          [ -n "$ingests" ] || { echo "no ingest in this compile"; exit 0; }
          git revert --no-commit HEAD $ingests || { git revert --abort; echo "the revert conflicts; not resetting"; exit 0; }
          git commit -q -m "reset: undo $(echo $ingests) [skip ci]"
          git push -q || echo "could not push the reset; reset from the UI"

      # An interrupted run committed its progress; dispatch the resume here, since the
      # push trigger ignores openwiki/**. Bounded at three in a row.
      - name: Resume an interrupted compile
        if: ${{ !cancelled() && steps.state.outcome == 'success' && steps.commit.outcome == 'success' && steps.commit.outputs.landed != 'superseded' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(jq -r .status .compile-state.json)
          [ "$status" = "interrupted" ] || { echo "compile $status; nothing to resume"; exit 0; }
          streak=$(git log -3 --format=%s -- .compile-state.json | grep -c '(interrupted)' || true)
          if [ "$streak" -ge 3 ]; then echo "three interrupted compiles in a row; not re-dispatching" >&2; exit 0; fi
          echo "re-dispatching to resume (interrupted streak $streak)"
          gh workflow run openwiki-update.yml --ref main

      # C9. Every terminal status. `|| true`: the callback is an optimisation; the state file is the mechanism.
      - name: Callback
        if: ${{ always() && !cancelled() }}
        run: ./scripts/callback.sh || true
        env:
          REFRESH_CALLBACK_URL: ${{ secrets.REFRESH_CALLBACK_URL }}
          REFRESH_CALLBACK_SECRET: ${{ secrets.REFRESH_CALLBACK_SECRET }}
          # A compile whose commit did not land is a failed refresh, whatever OpenWiki reports.
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          # true | unchanged | superseded | false. Superseded is reported as
          # such, not as failed: the run the newer push triggered recompiles.
          COMMIT_LANDED: ${{ steps.commit.outputs.landed }}

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
